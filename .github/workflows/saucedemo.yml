name: Testes E2E SauceDemo - Cypress

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  cypress:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: e2e-saucedemo

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Executar testes Cypress
        uses: cypress-io/github-action@v6
        with:
          working-directory: e2e-saucedemo

      - name: Salvar evidências (screenshots e vídeos)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencias-cypress
          path: e2e-saucedemo/cypress/evidencias
          if-no-files-found: warn
