name: Testes API ReqRes - Cypress

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  cypress:
    runs-on: ubuntu-latest
    env:
      CYPRESS_REQRES_API_KEY: ${{ secrets.REQRES_API_KEY }}

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Executar testes Cypress
        uses: cypress-io/github-action@v6
        with:
          working-directory: api-reqres

      - name: Salvar evidências
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencias-api
          path: |
            api-reqres/cypress/evidencias
            api-reqres/cypress/screenshots
          if-no-files-found: ignore
